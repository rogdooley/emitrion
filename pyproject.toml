[project]
name = "emitera"
version = "0.1.0"
description = "Multi-architecture shellcode emitter for educational security research"
requires-python = ">=3.12"
dependencies = [
    "pyyaml",
]

[project.scripts]
emitera = "emitera.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
]
