template: check_path
# Check whether a file path exists using GetFileAttributesA.
# First primitive: one API call, deterministic result, no side effects.
#
# Build:
#   uv run emitter Tools/emitter/manifests/check_path.yaml \
#       --dst "C:\\Windows\\System32\\cmd.exe" \
#       --out emitter_out/
badchars: ["00", "0a", "0d"]

functions:
  - GetFileAttributesA
  - ExitProcess

variables:
  - path_attrs

strings:
  - label: check_path
    value: "C:\\Windows\\System32\\cmd.exe"
    method: mov
    dest: edi
