# Check path (GetFileAttributesA) - x64
# IR workflow: GetFileAttributesA to test file existence.
#
# Build:
#   uv run emitrion-x64 emitrion/manifests/x64/check_path_x64.yaml \
#       --dst "C:\Windows\System32\cmd.exe" --out emitter_out/
arch: x64
template: ir_check_path
badchars: ["00", "0A", "0D"]

functions:
  - GetFileAttributesA
  - ExitProcess

variables:
  - path_attrs

strings:
  - label: check_path
    value: "C:\\Windows\\System32\\cmd.exe"
    method: mov
    dest: rdi
