# DLL injection via CreateRemoteThread + LoadLibraryA
# IR workflow: GetModuleHandleA + GetProcAddress(LoadLibraryA) ->
#   OpenProcess -> VirtualAllocEx -> WriteProcessMemory -> CreateRemoteThread
# Target PID must be set at build time or in the debug_runner.
#
# Build:
#   uv run emitrion emitrion/manifests/win-x86/process_inject.yaml \
#       --target-pid 1234 --dst "C:\Users\Public\payload.dll" \
#       --no-assemble --out emitter_out/
template: ir_process_inject
badchars: ["00", "0A", "0D"]
