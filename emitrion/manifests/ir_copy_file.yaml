template: ir_copy_file
# IR workflow: CopyFileA(src, dst, FALSE) with exit strategy.
#
# Build:
#   uv run emitrion emitrion/manifests/ir_copy_file.yaml \
#       --src "C:\\source.txt" --dst "C:\\dest.txt" --out emitter_out/
badchars: ["00", "0a", "0d"]

functions:
  - CopyFileA
  - ExitProcess

strings:
  - label: src_path
    value: "C:\\OSED\\source.txt"
    method: mov
    dest: edi
  - label: dst_path
    value: "C:\\OSED\\output.txt"
    method: mov
    dest: edi
